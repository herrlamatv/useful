<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>num</title>
<style>
  :root {
    --papier: #f3efe6;
    --karte: #faf7f0;
    --tinte: #23211d;
    --grau: #8b8579;
    --leise: #a8a296;
    --linie: #dcd5c6;
    --linie-zart: #e8e2d5;
    --akzent: #7a4a24;
    --treffer: #e7dcc4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --papier: #16150f;
      --karte: #1d1c15;
      --tinte: #e9e3d4;
      --grau: #918a79;
      --leise: #6d675b;
      --linie: #322f26;
      --linie-zart: #26241c;
      --akzent: #d2a273;
      --treffer: #3a3325;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--papier);
    color: var(--tinte);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.45;
  }

  main { max-width: 62rem; margin: 0 auto; padding: 0 16px 6rem; }

  /* Kopf */

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--papier);
    border-bottom: 1px solid var(--linie);
    padding-top: 14px;
  }

  .marke {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    margin-bottom: .7rem;
  }

  .marke h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: normal;
    letter-spacing: .02em;
  }

  .marke p {
    margin: 0;
    font-size: .8rem;
    color: var(--grau);
    flex: 1;
  }

  .werkzeuge { display: flex; align-items: center; gap: .4rem; }

  .schalter {
    appearance: none;
    background: none;
    border: 1px solid var(--linie);
    border-radius: 2px;
    color: var(--grau);
    font-family: var(--mono);
    font-size: .72rem;
    padding: .25rem .5rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .schalter:hover { color: var(--tinte); border-color: var(--grau); }
  .schalter[aria-pressed="true"] { color: var(--tinte); border-color: var(--tinte); }

  /* Eingabe */

  .eingabe { display: flex; gap: .5rem; flex-wrap: wrap; }

  .eingabe input[type="text"] {
    flex: 1 1 11rem;
    min-width: 0;
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: 2px;
    color: var(--tinte);
    font-family: var(--mono);
    font-size: 1.25rem;
    padding: .5rem .6rem;
  }

  .eingabe select {
    flex: 0 1 16rem;
    min-width: 0;
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: 2px;
    color: var(--tinte);
    font-family: var(--serif);
    font-size: 1rem;
    padding: .5rem .4rem;
  }

  .eingabe input:focus, .eingabe select:focus, .suche input:focus {
    outline: 1px solid var(--akzent);
    outline-offset: -1px;
  }

  .gelesen {
    margin: .35rem 0 0;
    min-height: 1.2em;
    font-family: var(--mono);
    font-size: .76rem;
    color: var(--grau);
  }

  .gelesen.fehler { color: var(--akzent); }

  /* Modusleiste */

  .leiste {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem 0 .6rem;
    flex-wrap: wrap;
  }

  .modi { display: flex; border: 1px solid var(--linie); border-radius: 2px; overflow: hidden; }

  .modi button {
    appearance: none;
    background: none;
    border: 0;
    border-right: 1px solid var(--linie);
    color: var(--grau);
    font-family: var(--serif);
    font-size: .9rem;
    padding: .3rem .85rem;
    cursor: pointer;
  }

  .modi button:last-child { border-right: 0; }
  .modi button[aria-pressed="true"] { background: var(--treffer); color: var(--tinte); }

  .suche { flex: 1 1 8rem; display: flex; }

  .suche input {
    width: 100%;
    background: none;
    border: 1px solid var(--linie);
    border-radius: 2px;
    color: var(--tinte);
    font-family: var(--serif);
    font-size: .85rem;
    padding: .3rem .5rem;
  }

  /* Kategorien */

  .kategorien {
    display: flex;
    gap: 1px;
    overflow-x: auto;
    border-top: 1px solid var(--linie-zart);
    scrollbar-width: thin;
  }

  .kategorien button {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--grau);
    font-family: var(--serif);
    font-size: .85rem;
    padding: .45rem .6rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .kategorien button:hover { color: var(--tinte); }
  .kategorien button[aria-pressed="true"] { color: var(--tinte); border-bottom-color: var(--akzent); }

  /* Ergebnisse */

  .quelle {
    margin: 1.1rem 0 .3rem;
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--leise);
  }

  .zeilen { border-top: 1px solid var(--linie); }

  .zeile {
    display: grid;
    grid-template-columns: minmax(8rem, 14rem) 1fr;
    gap: .2rem 1rem;
    align-items: baseline;
    padding: .5rem 0;
    border-bottom: 1px solid var(--linie-zart);
  }

  .zeile.aktiv { background: var(--treffer); }
  .zeile.trenn { border-top: 2px solid var(--linie); }

  .namen { min-width: 0; }
  .namen .haupt { display: block; font-size: .95rem; }
  .namen .neben { display: block; font-size: .74rem; color: var(--leise); }

  .namen .sym {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--grau);
    margin-left: .35rem;
  }

  .namen button {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .namen button:hover .haupt { color: var(--akzent); text-decoration: underline; }

  .werte { min-width: 0; }

  .ziffern {
    display: block;
    font-family: var(--mono);
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    cursor: pointer;
  }

  .ziffern:hover { color: var(--akzent); }

  .potenz {
    display: block;
    font-family: var(--mono);
    font-size: .84rem;
    color: var(--grau);
    cursor: pointer;
  }

  sup { font-size: .8em; line-height: 0; }

  .potenz:hover { color: var(--akzent); }

  .ca { color: var(--leise); font-family: var(--serif); }

  .mehr {
    appearance: none;
    background: none;
    border: 0;
    padding: 0 0 0 .3rem;
    font: inherit;
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--akzent);
    cursor: pointer;
  }

  /* Zahlenmodus */

  .tafel { border-top: 1px solid var(--linie); }
  .tafel .zeile { grid-template-columns: minmax(8rem, 12rem) 1fr; }

  .hinweis { margin: .6rem 0 0; font-size: .8rem; color: var(--grau); }

  .rahmen { overflow-x: auto; border: 1px solid var(--linie); border-radius: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: .82rem; }

  th, td {
    text-align: left;
    padding: .32rem .6rem;
    border-bottom: 1px solid var(--linie-zart);
    white-space: nowrap;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--karte);
    font-weight: normal;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--leise);
    border-bottom: 1px solid var(--linie);
  }

  tbody tr:hover { background: var(--treffer); }
  tbody tr.hier { background: var(--treffer); }

  td.p, td.z { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.z { max-width: 24rem; overflow: hidden; text-overflow: ellipsis; }
  td.kurz { font-family: var(--mono); color: var(--akzent); }

  footer {
    margin-top: 2.5rem;
    padding-top: .8rem;
    border-top: 1px solid var(--linie);
    font-size: .78rem;
    color: var(--leise);
  }

  .meldung {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translateX(-50%) translateY(1rem);
    background: var(--tinte);
    color: var(--papier);
    font-family: var(--mono);
    font-size: .78rem;
    padding: .4rem .8rem;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meldung.an { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Selbsttest */

  #pruefung { display: none; font-family: var(--mono); font-size: .8rem; }
  #pruefung.an { display: block; }
  #pruefung .ok { color: var(--grau); }
  #pruefung .fail { color: #c0392b; font-weight: bold; }
  #pruefung .kopf { font-size: 1rem; margin: 1.2rem 0 .5rem; font-family: var(--serif); }
  @media (prefers-color-scheme: dark) { #pruefung .fail { color: #ff7a6b; } }

  @media (max-width: 34rem) {
    .zeile { grid-template-columns: 1fr; gap: 0; }
    .namen { display: flex; align-items: baseline; gap: .35rem; flex-wrap: wrap; }
    .namen .neben { font-size: .72rem; }
    .marke p { display: none; }
  }
</style>
</head>
<body>

<main>

<header>
  <div class="marke">
    <h1>num</h1>
    <p id="untertitel">Zahlen &amp; Einheiten</p>
    <div class="werkzeuge">
      <button class="schalter" id="sprache" type="button" title="Sprache">EN</button>
      <button class="schalter" id="stellenAuf" type="button" title="Genauigkeit">12&nbsp;St.</button>
    </div>
  </div>

  <div class="eingabe">
    <input type="text" id="wert" value="1" autocomplete="off" spellcheck="false" inputmode="text">
    <select id="einheit"></select>
  </div>
  <p class="gelesen" id="gelesen"></p>

  <div class="leiste">
    <div class="modi">
      <button type="button" id="modusZahlen">Zahlen</button>
      <button type="button" id="modusEinheiten">Einheiten</button>
    </div>
    <label class="suche"><input type="text" id="suche" placeholder="suchen (/)" autocomplete="off" spellcheck="false"></label>
  </div>

  <nav class="kategorien" id="kategorien"></nav>
</header>

<section id="ausgabe"></section>

<footer id="fuss"></footer>

</main>

<div class="meldung" id="meldung" role="status" aria-live="polite"></div>
<div id="pruefung"></div>

<script>
"use strict";

/* ====================================================================
   1 | Dezimalarithmetik

   Ein Wert ist { m, e } und bedeutet  m x 10^e,  m als BigInt.
   JavaScripts Number kann hier nicht helfen: ab 1e21 erzwingt es
   Exponentialschreibweise (die Ziffernfolge einer Quadrillion waere
   gar nicht darstellbar) und ab 1e308 gibt es nur noch Infinity.
   ==================================================================== */

function D(m, e) { return { m: typeof m === "bigint" ? m : BigInt(m), e: e | 0 }; }

function betrag(m) { return m < 0n ? -m : m; }

function stellenZahl(m) { return betrag(m).toString().length; }

const POT = [];
function pot10(k) {
  if (k < 0) return 1n;
  if (POT[k] === undefined) POT[k] = 10n ** BigInt(k);
  return POT[k];
}

/* Nachlaufende Nullen der Mantisse in den Exponenten schieben.
   Haelt die Mantissen kurz und macht Vergleiche verlaesslich. */
function dNorm(a) {
  if (a.m === 0n) return D(0n, 0);
  let m = a.m, e = a.e;
  while (m % 10n === 0n) { m /= 10n; e++; }
  return { m: m, e: e };
}

/* Zahl aus einem String: "1", "-1.5", "1e-15", "2.54E3" */
function dVon(s) {
  s = String(s).trim();
  if (!s) return null;
  let neg = false;
  if (s[0] === "+") s = s.slice(1);
  else if (s[0] === "-") { neg = true; s = s.slice(1); }
  let e = 0;
  const i = s.search(/[eE]/);
  if (i >= 0) {
    const ex = s.slice(i + 1);
    if (!/^[+-]?\d+$/.test(ex)) return null;
    e = parseInt(ex, 10);
    s = s.slice(0, i);
  }
  const p = s.indexOf(".");
  if (p >= 0) { e -= s.length - p - 1; s = s.slice(0, p) + s.slice(p + 1); }
  if (!/^\d*$/.test(s)) return null;
  if (s === "") s = "0";
  let m = BigInt(s);
  if (neg) m = -m;
  return dNorm({ m: m, e: e });
}

function dNull(a) { return a.m === 0n; }
function dNeg(a) { return { m: -a.m, e: a.e }; }
function dMul(a, b) { return dNorm({ m: a.m * b.m, e: a.e + b.e }); }

function dAdd(a, b) {
  if (a.m === 0n) return b;
  if (b.m === 0n) return a;
  /* Liegen die Groessenordnungen extrem weit auseinander, verschwindet der
     kleinere Summand ohnehin unter jeder darstellbaren Stelle - ohne diese
     Schranke wuerde 10n ** ... hier unnoetig riesig werden. */
  if (Math.abs(a.e - b.e) > 400) return a.e > b.e ? a : b;
  const e = Math.min(a.e, b.e);
  const am = a.m * pot10(a.e - e);
  const bm = b.m * pot10(b.e - e);
  return dNorm({ m: am + bm, e: e });
}

function dSub(a, b) { return dAdd(a, dNeg(b)); }

function dCmp(a, b) {
  const d = dSub(a, b);
  return d.m === 0n ? 0 : (d.m < 0n ? -1 : 1);
}

/* Auf n signifikante Stellen runden (kaufmaennisch). */
function dRund(a, n) {
  if (a.m === 0n) return a;
  const l = stellenZahl(a.m);
  if (l <= n) return a;
  const weg = l - n;
  const p = pot10(weg);
  const neg = a.m < 0n;
  const m = betrag(a.m);
  let q = m / p;
  if ((m % p) * 2n >= p) q += 1n;
  return dNorm({ m: neg ? -q : q, e: a.e + weg });
}

/* Division mit Schutzstellen, danach auf n signifikante Stellen gerundet. */
function dDiv(a, b, n) {
  if (b.m === 0n) return null;
  if (a.m === 0n) return D(0n, 0);
  const ziel = Math.max(1, n | 0) + 6;
  let k = ziel - (stellenZahl(a.m) - stellenZahl(b.m));
  if (k < 0) k = 0;
  const za = betrag(a.m) * pot10(k);
  const zb = betrag(b.m);
  let q = za / zb;
  if ((za % zb) * 2n >= zb) q += 1n;
  const neg = (a.m < 0n) !== (b.m < 0n);
  return dRund(dNorm({ m: neg ? -q : q, e: a.e - b.e - k }), n);
}

/* Wie lang wuerde die ausgeschriebene Ziffernfolge? (vor dem Bauen pruefen) */
function dLaenge(a) {
  if (a.m === 0n) return 1;
  const l = stellenZahl(a.m);
  return a.e >= 0 ? l + a.e : Math.max(l, -a.e) + 2;
}

const ZU_LANG = 100000;

/* Volle Ziffernfolge, technisch: "-0.00123" */
function dPlain(a) {
  if (a.m === 0n) return "0";
  if (dLaenge(a) > ZU_LANG) return null;
  const neg = a.m < 0n;
  const s = betrag(a.m).toString();
  let out;
  if (a.e >= 0) {
    out = s + "0".repeat(a.e);
  } else {
    const k = -a.e;
    out = s.length > k
      ? s.slice(0, s.length - k) + "." + s.slice(s.length - k)
      : "0." + "0".repeat(k - s.length) + s;
  }
  return (neg ? "-" : "") + out;
}

/* Wissenschaftlich: Mantisse mit einer Stelle vor dem Komma + Exponent */
function dSci(a) {
  if (a.m === 0n) return { m: "0", e: 0 };
  const neg = a.m < 0n;
  const s = betrag(a.m).toString();
  const e = a.e + s.length - 1;
  const m = s.length > 1 ? s[0] + "." + s.slice(1) : s;
  return { m: (neg ? "-" : "") + m, e: e };
}

/* Technisch: Exponent auf ein Vielfaches von 3 gebracht */
function dEng(a) {
  if (a.m === 0n) return { m: "0", e: 0 };
  const sci = dSci(a);
  let e = Math.floor(sci.e / 3) * 3;
  const schub = sci.e - e;
  const neg = a.m < 0n;
  let s = betrag(a.m).toString();
  const vor = 1 + schub;
  if (s.length <= vor) s = s + "0".repeat(vor - s.length);
  const m = s.slice(0, vor) + (s.length > vor ? "." + s.slice(vor) : "");
  return { m: (neg ? "-" : "") + m, e: e };
}

/* ====================================================================
   2 | Brueche

   Manche Faktoren sind als Dezimalzahl nicht endlich: km/h ist 5/18,
   Knoten 1852/3600, psi lbf/in². Als Bruch bleiben sie exakt, und es
   wird genau einmal gerundet - ganz am Ende.
   ==================================================================== */

function rVon(s) {
  const t = String(s).split("/");
  const z = dVon(t[0]);
  const n = t.length > 1 ? dVon(t[1]) : D(1n, 0);
  if (!z || !n || n.m === 0n) return null;
  return { z: z, n: n };
}

const EINS = { z: D(1n, 0), n: D(1n, 0) };

/* Wert v in Einheit a -> Wert in Einheit b.
   v * (az/an) ist der Basiswert, geteilt durch (bz/bn) das Ergebnis:
   v * az * bn / (an * bz)  - eine einzige Division, eine einzige Rundung. */
function rechne(v, a, b, stellen) {
  const zaehler = dMul(dMul(v, a.z), b.n);
  const nenner = dMul(a.n, b.z);
  return dDiv(zaehler, nenner, stellen);
}

function ggt(x, y) {
  x = betrag(x); y = betrag(y);
  while (y) { const r = x % y; x = y; y = r; }
  return x;
}

/* Exakte Division - moeglich, wenn im gekuerzten Nenner nur noch die
   Faktoren 2 und 5 stehen, die Dezimalbruchentwicklung also abbricht.
   Dann wird ueberhaupt nicht gerundet. */
function dDivGenau(a, b) {
  if (b.m === 0n) return null;
  if (a.m === 0n) return D(0n, 0);
  let z = betrag(a.m), n = betrag(b.m);
  const g = ggt(z, n);
  z /= g; n /= g;
  let k2 = 0, k5 = 0;
  while (n % 2n === 0n) { n /= 2n; k2++; }
  while (n % 5n === 0n) { n /= 5n; k5++; }
  if (n !== 1n) return null;
  const m = Math.max(k2, k5);
  if (m > 2000) return null;
  z = z * (2n ** BigInt(m - k2)) * (5n ** BigInt(m - k5));
  const neg = (a.m < 0n) !== (b.m < 0n);
  return dNorm({ m: neg ? -z : z, e: a.e - b.e - m });
}

function rechneGenau(v, a, b) {
  return dDivGenau(dMul(dMul(v, a.z), b.n), dMul(a.n, b.z));
}

/* ====================================================================
   3 | Darstellung
   ==================================================================== */

const HOCH = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵",
               "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };

function hoch(n) {
  return String(n).split("").map(function (c) { return HOCH[c] || c; }).join("");
}

/* Fuer die Anzeige wird der Exponent ein echtes <sup>: hochgestellte
   Unicode-Ziffern sind im Monofont zu klein, um 10⁻¹³ und 10⁻¹⁵
   sicher zu unterscheiden. Kopiert wird weiterhin die Unicode-Fassung. */
function potBau(knoten, vor, basis, exp, nach) {
  if (vor) knoten.appendChild(document.createTextNode(vor));
  knoten.appendChild(document.createTextNode(basis));
  const s = document.createElement("sup");
  s.textContent = String(exp);
  knoten.appendChild(s);
  if (nach) knoten.appendChild(document.createTextNode(nach));
  return knoten;
}

function potSpan(cls, vor, basis, exp, nach) {
  return potBau(el("span", cls), vor, basis, exp, nach);
}

/* Technische Schreibweise (Exponent als Vielfaches von 3) als Knoten. */
function engKnoten(a, spr, cls) {
  const e = dEng(a);
  if (a.m === 0n) return el("span", cls, "0");
  if (e.e === 0) return el("span", cls, komma(e.m, spr));
  return potSpan(cls, komma(e.m, spr) + " × ", "10", e.e, null);
}

/* Vollstaendige wissenschaftliche Schreibweise als Knoten. */
function potenzKnoten(a, spr, cls) {
  const sci = dSci(a);
  if (a.m === 0n) return el("span", cls, "0");
  if (sci.e === 0) return el("span", cls, komma(sci.m, spr));
  const m = komma(sci.m, spr);
  const vor = m === "1" ? "" : (m === "-1" ? "-" : m + " × ");
  return potSpan(cls, vor, "10", sci.e, null);
}

const SCHMAL = " ";  /* schmales geschuetztes Leerzeichen */

/* Ziffernfolge lesbar machen: Tausendertrenner nach Sprache, der
   Nachkommateil nach ISO 80000 in Dreiergruppen mit schmalem Abstand. */
function gruppiere(plain, spr) {
  if (plain === null) return null;
  const tTausend = spr === "de" ? "." : ",";
  const tKomma = spr === "de" ? "," : ".";
  let neg = "";
  if (plain[0] === "-") { neg = "-"; plain = plain.slice(1); }
  const p = plain.indexOf(".");
  let ganz = p < 0 ? plain : plain.slice(0, p);
  let bruch = p < 0 ? "" : plain.slice(p + 1);

  if (ganz.length > 4) ganz = ganz.replace(/\B(?=(\d{3})+(?!\d))/g, tTausend);
  if (bruch.length > 5) bruch = bruch.replace(/(\d{3})(?=\d)/g, "$1" + SCHMAL);

  return neg + ganz + (bruch ? tKomma + bruch : "");
}

/* "1 × 10⁻¹⁵"  bzw. bei Exponent 0 schlicht die Mantisse */
function potenzText(a, spr) {
  const s = dSci(a);
  const m = komma(s.m, spr);
  if (a.m === 0n) return "0";
  if (s.e === 0) return m;
  if (s.m === "1") return "10" + hoch(s.e);
  if (s.m === "-1") return "-10" + hoch(s.e);
  return m + " × 10" + hoch(s.e);
}

/* Dezimalpunkt in das Trennzeichen der Sprache umsetzen */
function komma(s, spr) {
  return spr === "de" ? s.replace(".", ",") : s;
}

/* Sehr lange Ziffernfolgen anreissen; die volle Fassung bleibt abrufbar. */
const KURZ_AB = 44;

function kuerze(s) {
  if (s === null || s.length <= KURZ_AB) return null;
  return s.slice(0, KURZ_AB - 18) + "…" + s.slice(-14);
}

  ["Ki", "Kibi", 10], ["Mi", "Mebi", 20], ["Gi", "Gibi", 30],

/* --- die Leiter zu einer Tabelle zusammenfuehren ------------------- */

const SKALA = {};   /* Exponent -> Eintrag */

function skalaEintrag(e) {
  if (!SKALA[e]) SKALA[e] = { e: e, de: "", deK: "", en: "", enK: "", si: "", siDe: "", siEn: "", ind: "" };
  return SKALA[e];
}

/* klein: 10^0 bis 10^2 und die Kehrwerte */
[[0, "Eins", "one"], [1, "Zehn", "ten"], [2, "Hundert", "hundred"],
 [-1, "Zehntel", "tenth"], [-2, "Hundertstel", "hundredth"]].forEach(function (r) {
  const s = skalaEintrag(r[0]);
  s.de = r[1]; s.en = r[2];
});

/* deutsche lange Leiter, auf- und absteigend */
skalaEintrag(3).de = "Tausend";
skalaEintrag(-3).de = "Tausendstel";
STAMM_DE.forEach(function (stamm, i) {
  const n = i + 1;
  [[6 * n, stamm + "illion"], [6 * n + 3, stamm + "illiarde"]].forEach(function (r) {
    skalaEintrag(r[0]).de = r[1];
    /* "Milliarde" -> "Milliardstel", "Million" -> "Millionstel" */
    skalaEintrag(-r[0]).de = r[1].replace(/e$/, "") + "stel";
  });
});

/* englische kurze Leiter, auf- und absteigend */
skalaEintrag(3).en = "thousand";
skalaEintrag(-3).en = "thousandth";
STAMM_EN.forEach(function (stamm, i) {
  const e = 3 * (i + 1) + 3;
  skalaEintrag(e).en = stamm + "illion";
  skalaEintrag(-e).en = stamm + "illionth";
});

/* Kuerzel */
Object.keys(KURZ_DE).forEach(function (e) { skalaEintrag(+e).deK = KURZ_DE[e]; });
KURZ_EN.forEach(function (k, i) { skalaEintrag(3 * i + 3).enK = k; });

/* SI-Praefixe */
SI_PRAEFIX.forEach(function (p) {
  const s = skalaEintrag(p[3]);
  s.si = p[0]; s.siDe = p[1]; s.siEn = p[2];
});

/* indische Stufen */
INDISCH.forEach(function (p) { skalaEintrag(p[0]).ind = p[1]; });

/* Sonderfaelle */
skalaEintrag(100).de = "Googol"; skalaEintrag(100).en = "googol";
skalaEintrag(303).en = "centillion";
skalaEintrag(600).de = "Zentillion";

const SKALA_LISTE = Object.keys(SKALA)
  .map(Number)
  .sort(function (a, b) { return b - a; })
  .map(function (e) { return SKALA[e]; });

/* Fuer den Zahlenmodus: nur Stufen, die einen Namen tragen, absteigend. */
function leiter(feld) {
  return SKALA_LISTE.filter(function (s) { return s[feld]; });
}

const LEITER = {
  de: leiter("de"),
  en: leiter("en"),
  si: leiter("si"),
  ind: leiter("ind")
};

/* Groesste Stufe, die nicht ueber dem Wert liegt. */
function stufeFuer(a, liste) {
  if (a.m === 0n) return null;
  const e = dSci(a).e;
  for (let i = 0; i < liste.length; i++) {
    if (liste[i].e <= e) return liste[i];
  }
  return null;
}

/* Wert als "2,5 Milliarden" ausdruecken. */
function alsStufe(a, liste, feld, stellen, spr) {
  const s = stufeFuer(a, liste);
  if (!s) return null;
  const zahl = dDiv(a, D(1n, s.e), stellen);
  if (!zahl) return null;
  return {
    zahl: zahl,
    name: s[feld],
    kurz: feld === "de" ? s.deK : (feld === "en" ? s.enK : s.si),
    e: s.e,
    text: gruppiere(dPlain(zahl), spr) + " " + s[feld]
  };
}

/* --- Namen -> Exponent, fuer die Eingabe -------------------------- */

const NAME_EXP = { de: {}, en: {} };

function merkeName(spr, name, e) {
  if (!name) return;
  const k = name.toLowerCase();
  if (NAME_EXP[spr][k] === undefined) NAME_EXP[spr][k] = e;
}

function merkeBeide(name, e) { merkeName("de", name, e); merkeName("en", name, e); }

/* Erster Durchgang: jede Sprache traegt ihre eigenen Namen ein. */
SKALA_LISTE.forEach(function (s) {
  merkeName("de", s.de, s.e);
  merkeName("en", s.en, s.e);
  merkeBeide(s.ind, s.e);
  /* Plural: "Millionen", "Milliarden", "millions" */
  if (s.de) { merkeName("de", s.de + "n", s.e); merkeName("de", s.de + "en", s.e); }
  if (s.en) merkeName("en", s.en + "s", s.e);
});

/* Zweiter Durchgang: die Namen der jeweils anderen Sprache als
   Rueckfall - sie greifen nur dort, wo die eigene Leiter nichts kennt. */
SKALA_LISTE.forEach(function (s) {
  merkeName("de", s.en, s.e);
  merkeName("en", s.de, s.e);
  if (s.en) merkeName("de", s.en + "s", s.e);
  if (s.de) { merkeName("en", s.de + "n", s.e); merkeName("en", s.de + "en", s.e); }
});

/* Kuerzel sind gross-/kleinschreibungsempfindlich: "M" ist Mega (10^6),
   "m" ist Milli (10^-3). Darum eine eigene, exakte Tabelle. */
const KUERZEL_EXP = {};
SKALA_LISTE.forEach(function (s) {
  if (s.deK) KUERZEL_EXP[s.deK] = s.e;
  if (s.enK) KUERZEL_EXP[s.enK] = s.e;
});
SI_PRAEFIX.forEach(function (p) {
  KUERZEL_EXP[p[0]] = p[3];
  merkeBeide(p[1], p[3]);
  merkeBeide(p[2], p[3]);
});

/* Binaerpraefixe fuehren zu Zweierpotenzen, nicht zu Zehnerpotenzen. */
const IEC_WERT = {};
IEC_PRAEFIX.forEach(function (p) {
  IEC_WERT[p[0]] = dNorm(D(2n ** BigInt(p[2]), 0));
  IEC_WERT[p[1].toLowerCase()] = IEC_WERT[p[0]];
});

/* ====================================================================
   5 | Einheiten

   Jede Einheit traegt ihren Faktor zur Basiseinheit als exakten String -
   "0.0254" fuer Zoll, "5/18" fuer km/h, "1208925819614629174706176"
   fuer YiB. Was sich nicht exakt schreiben laesst (Pi, Planck, Parsec),
   ist mit ca: true markiert und wird mit einem "≈" ausgewiesen.
   ==================================================================== */

function E(sym, de, en, f, ca) {
  return { sym: sym, de: de, en: en, f: f, ca: !!ca };
}

const SI_NACH_EXP = {};
SI_PRAEFIX.forEach(function (p) { SI_NACH_EXP[p[3]] = p; });

/* Praefixleiter fuer eine SI-Basiseinheit.
   versatz: Verschiebung, wenn die Basiseinheit nicht auf 10^0 sitzt
   (Masse rechnet in kg, die Praefixe haengen aber am Gramm). */
function SI(sym, de, en, exps, versatz) {
  versatz = versatz || 0;
  const raus = [];
  exps.forEach(function (e) {
    if (e === 0) { raus.push(E(sym, de, en, "1e" + versatz)); return; }
    const p = SI_NACH_EXP[e];
    if (!p) return;
    raus.push(E(p[0] + sym, p[1] + de.toLowerCase(), p[2] + en.toLowerCase(), "1e" + (e + versatz)));
  });
  return raus;
}

const E_WINZIG = [3, 0, -3, -6, -9, -12];

/* Binaereinheiten aus den IEC-Praefixen erzeugen; der Faktor ist eine
   exakte Zweierpotenz, in voller Laenge ausgeschrieben. */
function binaer(sym, de, en, proEinheit) {
  return IEC_PRAEFIX.map(function (p) {
    const wert = (2n ** BigInt(p[2])) * BigInt(proEinheit);
    return E(p[0] + sym, p[1] + de, p[1].toLowerCase() + en, wert.toString());
  });
}

/* ====================================================================
   6 | Kategorien mit eigener Rechenvorschrift

   Temperatur ist affin (0 °C sind nicht 0 K), Verbrauch ist reziprok
   (mehr Liter pro 100 km heisst weniger Kilometer pro Liter). Beides
   laesst sich nicht als Faktor schreiben, also bekommt jede Einheit
   dort ein Paar Umrechnungen.
   ==================================================================== */

function T(sym, de, en, zu, von) {
  return { sym: sym, de: de, en: en, zu: zu, von: von, sonder: true };
}

const d27315 = dVon("273.15");
const d37315 = dVon("373.15");
const d45967 = dVon("459.67");
const d75 = dVon("7.5");
const f59 = { z: dVon("5"), n: dVon("9") };
const f95 = { z: dVon("9"), n: dVon("5") };
const f54 = { z: dVon("5"), n: dVon("4") };
const f45 = { z: dVon("4"), n: dVon("5") };
const f23 = { z: dVon("2"), n: dVon("3") };
const f32 = { z: dVon("3"), n: dVon("2") };
const f100_33 = { z: dVon("100"), n: dVon("33") };
const f33_100 = { z: dVon("33"), n: dVon("100") };
const f40_21 = { z: dVon("40"), n: dVon("21") };
const f21_40 = { z: dVon("21"), n: dVon("40") };

/* v mal Bruch, auf s Stellen */
function mb(v, f, s) { return dDiv(dMul(v, f.z), f.n, s); }

const TEMPERATUR = {
  id: "temperatur", de: "Temperatur", en: "Temperature", basis: "K", sonder: true,
  einheiten: [
    T("K", "Kelvin", "kelvin",
      function (v) { return v; },
      function (k) { return k; }),
    T("°C", "Grad Celsius", "degree Celsius",
      function (v) { return dAdd(v, d27315); },
      function (k) { return dSub(k, d27315); }),
    T("°F", "Grad Fahrenheit", "degree Fahrenheit",
      function (v, s) { return mb(dAdd(v, d45967), f59, s); },
      function (k, s) { return dSub(mb(k, f95, s), d45967); }),
    T("°R", "Grad Rankine", "degree Rankine",
      function (v, s) { return mb(v, f59, s); },
      function (k, s) { return mb(k, f95, s); }),
    T("°Ré", "Grad Réaumur", "degree Réaumur",
      function (v, s) { return dAdd(mb(v, f54, s), d27315); },
      function (k, s) { return mb(dSub(k, d27315), f45, s); }),
    T("°De", "Grad Delisle", "degree Delisle",
      function (v, s) { return dSub(d37315, mb(v, f23, s)); },
      function (k, s) { return mb(dSub(d37315, k), f32, s); }),
    T("°N", "Grad Newton", "degree Newton",
      function (v, s) { return dAdd(mb(v, f100_33, s), d27315); },
      function (k, s) { return mb(dSub(k, d27315), f33_100, s); }),
    T("°Rø", "Grad Rømer", "degree Rømer",
      function (v, s) { return dAdd(mb(dSub(v, d75), f40_21, s), d27315); },
      function (k, s) { return dAdd(mb(dSub(k, d27315), f21_40, s), d75); })
  ]
};

/* Verbrauch: "f" heisst linear zur Basis L/100km, "r" heisst reziprok
   (Basis = r / Wert), also die Kilometer-pro-Liter-Seite. */
function V(sym, de, en, art, wert) {
  const f = rVon(wert);
  const linear = art === "f";
  return {
    sym: sym, de: de, en: en, sonder: true,
    zu: function (v, s) {
      return linear ? dDiv(dMul(v, f.z), f.n, s) : dDiv(f.z, dMul(v, f.n), s);
    },
    von: function (b, s) {
      return linear ? dDiv(dMul(b, f.n), f.z, s) : dDiv(f.z, dMul(b, f.n), s);
    }
  };
}

const VERBRAUCH = {
  id: "verbrauch", de: "Verbrauch", en: "Fuel economy", basis: "L/100km", sonder: true,
  einheiten: [
    V("L/100km", "Liter pro 100 km", "litre per 100 km", "f", "1"),
    V("L/10km", "Liter pro 10 km", "litre per 10 km", "f", "10"),
    V("L/km", "Liter pro km", "litre per km", "f", "100"),
    V("km/L", "Kilometer pro Liter", "kilometre per litre", "r", "100"),
    V("m/L", "Meter pro Liter", "metre per litre", "r", "100000"),

  const vorn = GAENGIG[k.id];
  if (!vorn) return;
  const rang = {};

  /* sort ist stabil, im Rest bleibt die Groessenordnung also erhalten */
  k.einheiten.sort(function (a, b) {

    if (ra !== undefined && rb !== undefined) return ra - rb;
    if (ra !== undefined) return -1;

/* ====================================================================
   10 | Eingabe lesen

   Absichtlich grosszuegig: 1234 · 1 234 567 · 1.234.567,89 · 1e15 ·
   10^-15 · 10⁻¹⁵ · 2,5 Mrd · 3 quadrillion · 5 Qa · 1 Googol · 3 KiB ·
   7 femto · 1fm · 2 Mio km. Was gelesen wurde, wird zurueckgespiegelt.
   ==================================================================== */

const TIEF = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5",
               "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };

/* Trennzeichen aufloesen. Eindeutige Faelle entscheidet die Zeichenfolge
   selbst, nur beim echten Patt ("1.234") entscheidet die Sprache. */
function normZahl(s) {
  s = s.replace(/[\s']/g, "");
  const kA = s.indexOf(","), kZ = s.lastIndexOf(",");
  const pA = s.indexOf("."), pZ = s.lastIndexOf(".");
  const hatK = kA >= 0, hatP = pA >= 0;

  if (hatK && hatP) {
    /* beide vorhanden: das letzte ist das Dezimaltrennzeichen */
    return kZ > pZ ? s.replace(/\./g, "").replace(/,/g, ".")
                   : s.replace(/,/g, "");
  }
  if (hatK) {
    if (kA !== kZ) return s.replace(/,/g, "");              /* mehrfach = Gruppierung */
    const nach = s.slice(kZ + 1);
    if (!/^\d{3}$/.test(nach)) return s.replace(",", ".");  /* eindeutig Dezimal */
    return S.spr === "de" ? s.replace(",", ".") : s.replace(",", "");
  }
  if (hatP) {
    if (pA !== pZ) return s.replace(/\./g, "");
    const nach = s.slice(pZ + 1);
    if (!/^\d{3}$/.test(nach)) return s;                    /* eindeutig Dezimal */
    return S.spr === "de" ? s.replace(".", "") : s;
  }
  return s;
}

function skalaVon(tk) {
  if (KUERZEL_EXP[tk] !== undefined) return { e: KUERZEL_EXP[tk] };
  if (IEC_WERT[tk]) return { d: IEC_WERT[tk] };
  const kl = tk.toLowerCase();
  if (IEC_WERT[kl]) return { d: IEC_WERT[kl] };
  const e = NAME_EXP[S.spr][kl];
  if (e !== undefined) return { e: e };
  return null;
}

function einheitIn(kat, tk) {
  let tr = kat.einheiten.filter(function (u) { return u.sym === tk; })[0];
  if (tr) return tr;
  const kl = tk.toLowerCase();
  return kat.einheiten.filter(function (u) {
    return u.sym.toLowerCase() === kl || u.de.toLowerCase() === kl || u.en.toLowerCase() === kl;
  })[0] || null;
}

function einheitIrgendwo(tk) {
  for (let i = 0; i < KATEGORIEN.length; i++) {
    const u = einheitIn(KATEGORIEN[i], tk);
    if (u) return u;
  }
  return null;
}

function lese(roh) {
  const leer = { wert: null, einheit: null, hinweis: t("leer") };
  let s = String(roh).trim();
  if (!s) return leer;

  /* 10⁻¹⁵ -> 10^-15 (nur direkt hinter einer 10, damit cm² heil bleibt) */
  s = s.replace(/10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g, function (_, h) {
    return "10^" + h.split("").map(function (c) { return TIEF[c]; }).join("");
  });
  /* 2,5 × 10^9 -> 2,5e9 ;  10^-15 -> e-15 */
  s = s.replace(/(?:×|·|\*|x)?\s*10\s*\^\s*([+-]?\d+)/g, function (_, e) { return "e" + e; });
  if (/^e[+-]?\d/i.test(s)) s = "1" + s;

  const m = /^([+-]?[0-9][0-9.,'\s]*(?:[eE][+-]?[0-9]+)?)?\s*(.*)$/.exec(s);
  const zahlRoh = (m && m[1]) ? m[1] : "";
  const rest = (m && m[2] ? m[2] : "").trim();

  let wert = zahlRoh ? dVon(normZahl(zahlRoh)) : D(1n, 0);
  if (!wert) return { wert: null, einheit: null, hinweis: t("keinWert"), fehler: true };

  let einheit = null;
  const unbekannt = [];

  rest.split(/\s+/).filter(Boolean).forEach(function (tk) {
    /* Reihenfolge mit Absicht: in der offenen Kategorie schlaegt die
       Einheit die Groessenordnung. Sonst waere "5 B" in der Datenmenge
       nicht 5 Byte, sondern 5 Milliarden. */
    let u = einheitIn(S.kat, tk);
    if (u) { einheit = u; return; }

    const sk = skalaVon(tk);
    if (sk) {
      wert = sk.d ? dMul(wert, sk.d) : dMul(wert, D(1n, sk.e));
      return;
    }

    u = einheitIrgendwo(tk);
    if (u) { einheit = u; return; }

    unbekannt.push(tk);
  });

  return {
    wert: wert,
    einheit: einheit,
    unbekannt: unbekannt,
    hinweis: unbekannt.length ? t("unbekannt") + " " + unbekannt.join(" ") : null,
    fehler: unbekannt.length > 0
  };
}

/* Wert in Einheit "von" ausgedrueckt in Einheit "nach". */
function um(wert, von, nach, stellen) {
  if (!wert) return null;
  if (von === nach) return wert;
  if (von.sonder || nach.sonder) {
    const basis = von.zu(wert, stellen + 8);
    if (!basis) return null;
    const r = nach.von(basis, stellen + 8);
    return r ? dRund(r, stellen) : null;
  }
  /* Geht es exakt auf, wird ungekuerzt gezeigt: die Stellen-Einstellung
     begrenzt nur das, was ohnehin gerundet werden muss. */
  const genau = rechneGenau(wert, von.rf, nach.rf);
  if (genau && dLaenge(genau) <= ZU_LANG) return genau;
  return rechne(wert, von.rf, nach.rf, stellen);
}

/* ====================================================================
   12 | Zwischenablage

   Unter file:// ist die Clipboard-API nicht ueberall freigegeben,
   deshalb der alte Weg als Rueckfall.
   ==================================================================== */

let meldungZeit = null;

function melde(text) {
  const el = document.getElementById("meldung");
  el.textContent = text;
  el.classList.add("an");
  clearTimeout(meldungZeit);
  meldungZeit = setTimeout(function () { el.classList.remove("an"); }, 1600);
}

function kopiere(text) {
  function fertig() { melde(t("kopiert") + " " + text); }
  function altWeg() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); fertig(); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(fertig, altWeg);
  } else {
    altWeg();
  }
}

  if (a.m === 0n || a.m < 0n) return null;

  for (let i = IEC_PRAEFIX.length - 1; i >= 0; i--) {
    const w = IEC_WERT[IEC_PRAEFIX[i][0]];
    if (dCmp(a, w) >= 0) { treffer = IEC_PRAEFIX[i]; break; }
  }
  if (!treffer) return null;
  const zahl = dDiv(a, IEC_WERT[treffer[0]], stellen);
  return { zahl: zahl, name: treffer[1], sym: treffer[0], b: treffer[2] };

  tech.appendChild(potSpan("potenz", null, "10", eng.e, null));
  reihe(t("tech"), null, tech);

  /* Die beiden Leitern nebeneinander - genau hier gehen Deutsch und
     Englisch auseinander: 10^12 ist Billion, aber trillion. */
  [["de", "de", t("leiterDe")], ["en", "en", t("leiterEn")]].forEach(function (r) {
    const st = alsStufe(a, LEITER[r[0]], r[1], s, S.spr);

  const stEn = alsStufe(a, SKALA_LISTE.filter(function (x) { return x.enK; }), "enK", s, S.spr);

function zeichneSuche(ziel) {
  const q = S.suche.toLowerCase();
  const treffer = [];
  KATEGORIEN.forEach(function (k) {
    k.einheiten.forEach(function (u) {
      if (u.sym.toLowerCase().indexOf(q) >= 0 ||
          u.de.toLowerCase().indexOf(q) >= 0 ||
          u.en.toLowerCase().indexOf(q) >= 0 ||
          k.de.toLowerCase().indexOf(q) >= 0 ||
          k.en.toLowerCase().indexOf(q) >= 0) {
        treffer.push(u);
      }
    });
  });

  ziel.appendChild(el("p", "quelle", t("treffer") + " · " + treffer.length));
  if (!treffer.length) {
    ziel.appendChild(el("p", "hinweis", t("keineTreffer")));
    return;
  }

  const liste = el("div", "zeilen");
  treffer.slice(0, 180).forEach(function (u) {
    const links = namenBlock(u, true);
    links.querySelector(".neben").textContent = nm2(u) + " · " + nm(u.kat);
    /* Quer durch die Kategorien waere eine Umrechnung sinnlos, also
       zeigt die Suche, wie viel eine Einheit in ihrer Basis ist. */
    const basisU = u.kat.basisU;
    const w = um(D(1n, 0), u, basisU, S.stellen);
    const box = werteBlock(w, u.ca);
    box.insertBefore(el("span", "potenz", "1 " + u.sym + " = … " + basisU.sym), box.firstChild);
    liste.appendChild(zeile(links, box, u === S.einheit));
  });
  ziel.appendChild(liste);
}

function zeichneKategorien() {

      S.modus = "einheiten";

    });

  });

}

function fuelleAuswahl() {
  const sel = document.getElementById("einheit");
  sel.textContent = "";
  KATEGORIEN.forEach(function (k) {
    const g = document.createElement("optgroup");
    g.label = nm(k);
    k.einheiten.forEach(function (u) {

      o.textContent = nm(u) + " (" + u.sym + ")";
      g.appendChild(o);
    });

function waehle(u) {
  S.einheit = u;
  S.kat = u.kat;
  S.suche = "";
  document.getElementById("suche").value = "";
  S.modus = "einheiten";
  document.getElementById("einheit").value = u.kat.id + "/" + u.sym;
  zeichne();
}

function zeichne() {
  document.documentElement.lang = S.spr;
  document.getElementById("untertitel").textContent = t("untertitel");
  document.getElementById("sprache").textContent = S.spr === "de" ? "EN" : "DE";
  document.getElementById("stellenAuf").textContent = S.stellen + " " + t("stellen");
  document.getElementById("suche").placeholder = t("suchen");
  document.getElementById("modusZahlen").textContent = t("zahlen");
  document.getElementById("modusEinheiten").textContent = t("einheiten");
  document.getElementById("modusZahlen").setAttribute("aria-pressed", String(S.modus === "zahlen"));
  document.getElementById("modusEinheiten").setAttribute("aria-pressed", String(S.modus === "einheiten"));
  document.getElementById("fuss").textContent = t("fuss");

  const gel = document.getElementById("gelesen");
  const g = lese(S.roh);
  gel.className = "gelesen" + (g.fehler ? " fehler" : "");
  gel.textContent = "";
  if (g.hinweis) {
    gel.textContent = g.hinweis;
  } else if (g.wert) {
    gel.appendChild(document.createTextNode(t("gelesen") + ": "));
    gel.appendChild(potenzKnoten(g.wert, S.spr, "gel"));
    if (dLaenge(g.wert) <= 40) {
      gel.appendChild(document.createTextNode("  =  " + gruppiere(dPlain(g.wert), S.spr)));
    }
  }
  if (g.wert) S.wert = g.wert;
  if (g.einheit && g.einheit !== S.einheit) {
    S.einheit = g.einheit;
    S.kat = g.einheit.kat;
    document.getElementById("einheit").value = S.kat.id + "/" + S.einheit.sym;
  }

  zeichneKategorien();

  const ziel = document.getElementById("ausgabe");
  ziel.textContent = "";
  if (S.suche) zeichneSuche(ziel);
  else if (S.modus === "zahlen") zeichneZahlen(ziel);
  else zeichneEinheiten(ziel);

  schreibeHash();
}

function schreibeHash() {
  const h = S.modus === "zahlen"
    ? "#z=" + encodeURIComponent(S.roh)
    : "#e=" + S.kat.id + "/" + encodeURIComponent(S.einheit.sym) + "/" + encodeURIComponent(S.roh);
  try { history.replaceState(null, "", h); } catch (e) {}
}

function leseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!h) return;
  if (h.indexOf("e=") === 0) {
    const teile = h.slice(2).split("/");
    const u = EINHEIT_NACH_SYM[teile[0] + "/" + teile[1]];
    if (u) { S.einheit = u; S.kat = u.kat; S.modus = "einheiten"; }
    if (teile[2] !== undefined) S.roh = teile.slice(2).join("/");
  } else if (h.indexOf("z=") === 0) {
    S.modus = "zahlen";
    S.roh = h.slice(2);
  }
}

function bindeEreignisse() {
  const wert = document.getElementById("wert");
  const einheit = document.getElementById("einheit");
  const suche = document.getElementById("suche");

  wert.addEventListener("input", function () {
    S.roh = wert.value;
    zeichne();
  });

  einheit.addEventListener("change", function () {
    const u = EINHEIT_NACH_SYM[einheit.value];
    if (u) { S.einheit = u; S.kat = u.kat; S.modus = "einheiten"; S.suche = ""; suche.value = ""; }
    zeichne();
  });

  document.getElementById("modusZahlen").addEventListener("click", function () {
    S.modus = "zahlen"; S.suche = ""; suche.value = ""; zeichne();
  });

  document.getElementById("modusEinheiten").addEventListener("click", function () {
    S.modus = "einheiten"; S.suche = ""; suche.value = ""; zeichne();
  });

  document.getElementById("sprache").addEventListener("click", function () {
    S.spr = S.spr === "de" ? "en" : "de";
    merke("spr", S.spr);
    fuelleAuswahl();
    zeichne();
  });

  document.getElementById("stellenAuf").addEventListener("click", function () {
    const i = STELLEN_STUFEN.indexOf(S.stellen);
    S.stellen = STELLEN_STUFEN[(i + 1) % STELLEN_STUFEN.length];
    merke("stellen", String(S.stellen));
    zeichne();
  });

  suche.addEventListener("input", function () {
    S.suche = suche.value.trim();
    zeichne();
  });

  document.addEventListener("keydown", function (e) {
    const imFeld = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !imFeld) { e.preventDefault(); suche.focus(); }
    else if (e.key === "Escape") {
      if (S.suche) { S.suche = ""; suche.value = ""; zeichne(); }
      document.activeElement.blur();
    }
  });
}

function U(kat, sym) { return EINHEIT_NACH_SYM[kat + "/" + sym]; }

function wandle(kat, von, nach, wert, stellen) {
  const a = U(kat, von), b = U(kat, nach);
  if (!a || !b) return "EINHEIT FEHLT " + kat + "/" + von + " " + nach;
  const r = um(dVon(wert), a, b, stellen || 24);
  return r === null ? "null" : dPlain(r);
}

  box.insertBefore(summe, box.firstChild);
}
