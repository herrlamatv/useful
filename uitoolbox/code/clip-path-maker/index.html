<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="docTitle">Clip-Path Maker</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="../index.html" class="back" data-i18n="back">← Overview</a>
  <h1>Clip-Path Maker</h1>
  <label class="toggle"><input type="checkbox" id="showGhost" checked> <span data-i18n="showGhost">Show cut-out</span></label>
  <button id="resetAll" data-i18n="reset">Reset</button>
  <span data-lang-switch></span>
</header>

<main>
  <aside>
    <details open>
      <summary data-i18n="mode">Mode</summary>
      <div class="rows">
        <div class="seg modes" id="modes">
          <button data-mode="polygon" class="active">polygon()</button>
          <button data-mode="circle">circle()</button>
          <button data-mode="ellipse">ellipse()</button>
          <button data-mode="inset">inset()</button>
        </div>
      </div>
    </details>

    <details open id="presetBox">
      <summary data-i18n="presets">Presets</summary>
      <div class="rows presets" id="presets"><!-- generated by script.js --></div>
    </details>

    <details open id="sliderBox" hidden>
      <summary data-i18n="params">Parameters</summary>
      <div class="rows" id="sliders"><!-- generated by script.js --></div>
    </details>

    <details open>
      <summary data-i18n="preview">Preview</summary>
      <div class="rows">
        <div class="row">
          <span data-i18n="background">Background</span>
          <select id="bgSelect">
            <option value="g1" data-i18n="bgG1">Gradient</option>
            <option value="g2" data-i18n="bgG2">Conic</option>
            <option value="g3" data-i18n="bgG3">Stripes</option>
            <option value="g4" data-i18n="bgG4">Checks</option>
            <option value="g5" data-i18n="bgG5">Dots</option>
          </select>
        </div>
      </div>
    </details>

    <p class="hint" id="hint" data-i18n-html="hint">
      Drag points to move them.<br>
      Double-click adds a point.<br>
      Right-click, or select + <kbd>Del</kbd>, removes a point.
    </p>
  </aside>

  <section class="preview-area">
    <div class="stage" id="stage">
      <div class="shape ghost g1" id="ghost"></div>
      <div class="shape g1" id="shape"></div>
      <svg class="outline" id="outline" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon id="outlinePoly" points=""></polygon>
      </svg>
      <div id="handles"></div>
    </div>
  </section>

  <section class="code-area">
    <div class="code-head">
      <span class="eyebrow" data-i18n="generated">Generated CSS</span>
      <button id="copy" data-i18n="copy">Copy</button>
    </div>
    <pre id="code"></pre>
    <div class="points-info" id="pointsInfo"></div>
  </section>
</main>

<script src="../../i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
