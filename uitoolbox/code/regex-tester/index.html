<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="docTitle">Regex Tester</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="../index.html" class="back" data-i18n="back">← Overview</a>
  <h1>Regex Tester</h1>
  <select id="presets"><option value="" data-i18n="loadExample">Load example …</option></select>
  <button id="resetAll" data-i18n="clear">Clear</button>
  <span data-lang-switch></span>
</header>

<main>
  <section class="work">
    <div class="panel">
      <div class="panel-head">
        <span data-i18n="pattern">Pattern</span>
        <span class="count" id="count">0 matches</span>
      </div>
      <div class="pattern-row">
        <span class="slash">/</span>
        <input type="text" id="pattern" spellcheck="false" autocomplete="off" placeholder="Regular expression …" data-i18n-attr="placeholder:patternPh">
        <span class="slash">/</span>
        <div class="flags" id="flags">
          <button data-flag="g" class="on" title="global – all matches" data-i18n-attr="title:flagG">g</button>
          <button data-flag="i" title="ignoreCase – case-insensitive" data-i18n-attr="title:flagI">i</button>
          <button data-flag="m" title="multiline – ^ and $ per line" data-i18n-attr="title:flagM">m</button>
          <button data-flag="s" title="dotAll – . also matches line breaks" data-i18n-attr="title:flagS">s</button>
          <button data-flag="u" title="unicode" data-i18n-attr="title:flagU">u</button>
          <button data-flag="y" title="sticky – only from lastIndex" data-i18n-attr="title:flagY">y</button>
        </div>
      </div>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="panel grow">
      <div class="panel-head"><span data-i18n="testText">Test text</span><span class="muted" data-i18n="liveHint">Matches are highlighted live</span></div>
      <div class="editor" id="editor">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <textarea id="text" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span data-i18n="replace">Replace</span></div>
      <div class="pattern-row">
        <input type="text" id="replace" spellcheck="false" autocomplete="off" placeholder="Replacement, e.g. [$1] or $<name> or $&amp;" data-i18n-attr="placeholder:replacePh">
      </div>
      <div class="code-head">
        <span class="eyebrow" data-i18n="preview">Preview</span>
        <button id="copy" data-i18n="copy">Copy</button>
      </div>
      <pre id="replaced"></pre>
    </div>

    <div class="panel">
      <div class="panel-head"><span data-i18n="matches">Matches</span></div>
      <div class="table-wrap">
        <table id="matches">
          <thead><tr><th>#</th><th data-i18n="thIndex">Index</th><th data-i18n="thMatch">Match</th><th data-i18n="thGroups">Groups</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <aside id="cheats"><!-- generated by script.js --></aside>
</main>

<script src="../../i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
