<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="docTitle">CSS Playground</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="../index.html" class="back" data-i18n="back">← Overview</a>
  <h1 data-i18n="heading">CSS Playground</h1>
  <button id="random" data-i18n="random">Random</button>
  <button id="resetAll" data-i18n="reset">Reset</button>
  <span data-lang-switch></span>
</header>

<main>
  <aside id="controls"><!-- generated by script.js --></aside>

  <section class="preview-area" id="previewArea">
    <div id="box">Box</div>
  </section>

  <section class="code-area">
    <div class="code-head">
      <span class="eyebrow" data-i18n="generated">Generated CSS</span>
      <button id="copy" data-i18n="copy">Copy</button>
    </div>
    <pre id="code"></pre>
    <label class="bg-pick"><span data-i18n="stageBg">Preview background</span> <input type="color" id="stageBg" value="#f3efe5"></label>
  </section>
</main>

<script src="../../i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
