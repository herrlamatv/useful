<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="docTitle">Flexbox Playground</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="../index.html" class="back" data-i18n="back">← Overview</a>
  <h1 data-i18n="heading">Flexbox Playground</h1>
  <button id="addItem" data-i18n="addItem">Add item</button>
  <button id="removeItem" data-i18n="removeItem">Remove item</button>
  <button id="resetAll" data-i18n="reset">Reset</button>
  <span data-lang-switch></span>
</header>

<main>
  <aside id="controls">
    <details open>
      <summary data-i18n="container">Container</summary>
      <div class="rows" id="containerCtrls"><!-- generated by script.js --></div>
    </details>
    <details open>
      <summary id="itemTitle">Item</summary>
      <div class="rows">
        <p class="hint" id="itemHint" data-i18n="itemHint">Click an item in the preview to edit it.</p>
        <div id="itemCtrls" class="rows-inner" hidden>
          <div class="row"><span>flex-grow</span><input type="range" id="grow" min="0" max="5" step="1"><output id="growOut"></output></div>
          <div class="row"><span>flex-shrink</span><input type="range" id="shrink" min="0" max="5" step="1"><output id="shrinkOut"></output></div>
          <div class="row"><span>flex-basis</span><input type="text" id="basis" placeholder="auto, 120px, 30%"></div>
          <div class="row"><span>order</span><input type="number" id="order" min="-10" max="20" step="1"></div>
          <div class="group"><span class="label">align-self</span><div class="seg" id="alignSelf"></div></div>
        </div>
      </div>
    </details>
  </aside>

  <section class="preview-area" id="previewArea">
    <div id="container"></div>
  </section>

  <section class="code-area">
    <div class="code-head">
      <span class="eyebrow" data-i18n="generated">Generated CSS</span>
      <button id="copy" data-i18n="copy">Copy</button>
    </div>
    <pre id="code"></pre>
  </section>
</main>

<script src="../../i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
