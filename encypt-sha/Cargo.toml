[package]
name = "encsha"
version = "1.0.0"
edition = "2021"
authors = ["herrlamatv"]
description = "hash, encrypt, sign, encode - the common algorithms (SHA-2/3, BLAKE, AES, ChaCha20, RSA, Ed25519, Argon2 ...) in one tool"
default-run = "encsha"

[lib]
name = "encsha"
path = "src/lib.rs"

# GUI (double click)
[[bin]]
name = "encsha"
path = "src/main.rs"

# command line, short to type
[[bin]]
name = "esh"
path = "src/bin/esh.rs"

# RustCrypto 0.10 generation on purpose: rsa / ed25519 / argon2 / aes-gcm all share these
# versions (the 0.11 generation only has a release candidate of rsa so far)
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rpassword = "7"
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

# hashes + checksums
digest = "0.10"
md4 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
ripemd = "0.1"
whirlpool = "0.10"
sm3 = "0.4"
streebog = "0.10"
tiger = "0.2"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
hmac = "0.12"
hkdf = "0.12"

# ciphers
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
chacha20poly1305 = "0.10"
cipher = "0.4"
aes = "0.8"
ctr = "0.9"
camellia = "0.1"
twofish = "0.7"
serpent = "0.5"
sm4 = "0.5"
blowfish = "0.9"
cast5 = "0.11"
des = "0.8"

# key pairs + passwords
rsa = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core", "digest"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
argon2 = "0.5"
scrypt = "0.11"
pbkdf2 = { version = "0.12", features = ["simple"] }
bcrypt = "0.17"
pwhash = "1"
rand = "0.8"
zeroize = "1"

# encodings
base64 = "0.22"
data-encoding = "2"
bs58 = "0.5"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# the KDFs (Argon2, scrypt, bcrypt) are painfully slow unoptimized
[profile.dev.package."*"]
opt-level = 3
