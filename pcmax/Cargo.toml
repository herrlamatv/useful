[package]
name = "pcmax"
version = "1.0.0"
edition = "2021"
authors = ["herrlamatv"]
description = "give a process / window more or less CPU, RAM, GPU and I/O - plus a general boost, fast unzip and fast copy"
default-run = "pcmax"

[lib]
name = "pcmax"
path = "src/lib.rs"

# GUI + tray (double click)
[[bin]]
name = "pcmax"
path = "src/main.rs"

# command line, short to type
[[bin]]
name = "pcm"
path = "src/bin/pcm.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
rayon = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd", "lzma", "xz"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "zstd", "deflate", "util"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "optimization"] }
bzip2 = "0.6"
windows-sys = { version = "0.59", features = [
    "Wdk_Graphics_Direct3D",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# tests build .7z archives
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
